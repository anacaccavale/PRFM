<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Session Creator</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        background: #0d0d0f;
        color: #f2f2f2;
      }

      .page {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        padding: 28px 16px 40px;
      }

      .panel {
        width: 100%;
        max-width: 760px;
      }

      h1 {
        margin: 0 0 6px;
        font-size: 28px;
      }

      .sub {
        margin: 0 0 24px;
        color: #a0a0a8;
        font-size: 14px;
      }

      .card {
        background: #151518;
        border: 1px solid #27272e;
        border-radius: 14px;
        padding: 18px;
        margin-bottom: 18px;
      }

      .form-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .field.full {
        grid-column: 1 / -1;
      }

      label {
        font-size: 12px;
        color: #b6b6bf;
      }

      input {
        width: 100%;
        height: 40px;
        border-radius: 10px;
        border: 1px solid #30303a;
        background: #0f0f13;
        color: #f2f2f2;
        padding: 0 12px;
        font-size: 14px;
      }

      input:focus {
        outline: none;
        border-color: #4c7dff;
      }

      .primary-btn {
        margin-top: 16px;
        width: 100%;
        height: 42px;
        border: none;
        border-radius: 10px;
        background: #4c7dff;
        color: white;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }

      .primary-btn:hover {
        background: #436ee2;
      }

      .primary-btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .sessions-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 14px;
      }

      .sessions-head h2 {
        margin: 0;
        font-size: 18px;
      }

      .muted {
        color: #8f8f98;
        font-size: 13px;
      }

      .session-list {
        display: grid;
        gap: 12px;
      }

      .session-row {
        border: 1px solid #2e2e38;
        background: #111116;
        border-radius: 12px;
        padding: 12px;
      }

      .session-title {
        margin: 0 0 6px;
        font-size: 16px;
      }

      .session-meta {
        margin: 0;
        color: #a8a8b0;
        font-size: 13px;
      }

      .actions {
        margin-top: 12px;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .action-btn {
        height: 34px;
        padding: 0 12px;
        border-radius: 8px;
        border: 1px solid #353543;
        background: #191923;
        color: #ececf4;
        cursor: pointer;
        font-size: 12px;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
      }

      .action-btn:hover {
        background: #222230;
      }

      @media (max-width: 640px) {
        .form-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="module">
      import React, { useMemo, useState } from "https://esm.sh/react@18.3.1";
      import { createRoot } from "https://esm.sh/react-dom@18.3.1/client";

      function toUtcStamp(dateValue, timeValue) {
        const date = new Date(`${dateValue}T${timeValue}:00`);
        const year = date.getUTCFullYear();
        const month = String(date.getUTCMonth() + 1).padStart(2, "0");
        const day = String(date.getUTCDate()).padStart(2, "0");
        const hour = String(date.getUTCHours()).padStart(2, "0");
        const minute = String(date.getUTCMinutes()).padStart(2, "0");
        const second = String(date.getUTCSeconds()).padStart(2, "0");
        return `${year}${month}${day}T${hour}${minute}${second}Z`;
      }

      function escapeIcsText(value) {
        return value.replace(/\\/g, "\\\\").replace(/,/g, "\\,").replace(/;/g, "\\;").replace(/\n/g, "\\n");
      }

      function formatDisplayDate(dateValue) {
        if (!dateValue) {
          return "";
        }

        const date = new Date(`${dateValue}T00:00:00`);
        return date.toLocaleDateString(undefined, {
          weekday: "short",
          year: "numeric",
          month: "short",
          day: "numeric",
        });
      }

      function SessionCreator() {
        const [clientName, setClientName] = useState("");
        const [date, setDate] = useState("");
        const [startTime, setStartTime] = useState("");
        const [endTime, setEndTime] = useState("");
        const [sessions, setSessions] = useState([]);

        const canCreate = useMemo(() => {
          if (!clientName || !date || !startTime || !endTime) {
            return false;
          }
          return endTime > startTime;
        }, [clientName, date, startTime, endTime]);

        function buildGoogleCalendarUrl(session) {
          const startUtc = toUtcStamp(session.date, session.startTime);
          const endUtc = toUtcStamp(session.date, session.endTime);
          const url = new URL("https://calendar.google.com/calendar/render");
          url.searchParams.set("action", "TEMPLATE");
          url.searchParams.set("text", `Fitness Session - ${session.clientName}`);
          url.searchParams.set("dates", `${startUtc}/${endUtc}`);
          url.searchParams.set("details", `Coaching session with ${session.clientName}`);
          return url.toString();
        }

        function downloadIcs(session) {
          const startUtc = toUtcStamp(session.date, session.startTime);
          const endUtc = toUtcStamp(session.date, session.endTime);
          const createdUtc = toUtcStamp(
            new Date().toISOString().slice(0, 10),
            new Date().toISOString().slice(11, 16)
          );
          const title = `Fitness Session - ${session.clientName}`;
          const description = `Coaching session with ${session.clientName}`;
          const uid = `${session.id}@session-creator-mvp`;

          const ics = [
            "BEGIN:VCALENDAR",
            "VERSION:2.0",
            "PRODID:-//Session Creator MVP//EN",
            "CALSCALE:GREGORIAN",
            "BEGIN:VEVENT",
            `UID:${uid}`,
            `DTSTAMP:${createdUtc}`,
            `DTSTART:${startUtc}`,
            `DTEND:${endUtc}`,
            `SUMMARY:${escapeIcsText(title)}`,
            `DESCRIPTION:${escapeIcsText(description)}`,
            "END:VEVENT",
            "END:VCALENDAR",
          ].join("\r\n");

          const blob = new Blob([ics], { type: "text/calendar;charset=utf-8;" });
          const url = URL.createObjectURL(blob);
          const anchor = document.createElement("a");
          const safeName = session.clientName.toLowerCase().replace(/[^a-z0-9]+/g, "-");

          anchor.href = url;
          anchor.download = `${safeName || "session"}-${session.date}.ics`;
          document.body.appendChild(anchor);
          anchor.click();
          document.body.removeChild(anchor);
          URL.revokeObjectURL(url);
        }

        function createSession(event) {
          event.preventDefault();

          if (!canCreate) {
            return;
          }

          const newSession = {
            id: crypto.randomUUID(),
            clientName: clientName.trim(),
            date,
            startTime,
            endTime,
          };

          setSessions((prev) => [newSession, ...prev]);
          setClientName("");
          setDate("");
          setStartTime("");
          setEndTime("");
        }

        return React.createElement(
          "main",
          { className: "page" },
          React.createElement(
            "section",
            { className: "panel" },
            React.createElement("h1", null, "Session Creator"),
            React.createElement("p", { className: "sub" }, "Create coaching sessions and instantly export to calendar."),
            React.createElement(
              "form",
              { className: "card", onSubmit: createSession },
              React.createElement(
                "div",
                { className: "form-grid" },
                React.createElement(
                  "div",
                  { className: "field full" },
                  React.createElement("label", { htmlFor: "clientName" }, "Client name"),
                  React.createElement("input", {
                    id: "clientName",
                    type: "text",
                    placeholder: "Ex: Jordan Smith",
                    value: clientName,
                    onChange: (event) => setClientName(event.target.value),
                  })
                ),
                React.createElement(
                  "div",
                  { className: "field" },
                  React.createElement("label", { htmlFor: "date" }, "Date"),
                  React.createElement("input", {
                    id: "date",
                    type: "date",
                    value: date,
                    onChange: (event) => setDate(event.target.value),
                  })
                ),
                React.createElement(
                  "div",
                  { className: "field" },
                  React.createElement("label", { htmlFor: "startTime" }, "Start time"),
                  React.createElement("input", {
                    id: "startTime",
                    type: "time",
                    value: startTime,
                    onChange: (event) => setStartTime(event.target.value),
                  })
                ),
                React.createElement(
                  "div",
                  { className: "field" },
                  React.createElement("label", { htmlFor: "endTime" }, "End time"),
                  React.createElement("input", {
                    id: "endTime",
                    type: "time",
                    value: endTime,
                    onChange: (event) => setEndTime(event.target.value),
                  })
                )
              ),
              React.createElement(
                "button",
                { className: "primary-btn", type: "submit", disabled: !canCreate },
                "Create Session"
              )
            ),
            React.createElement(
              "section",
              { className: "card" },
              React.createElement(
                "div",
                { className: "sessions-head" },
                React.createElement("h2", null, "Sessions"),
                React.createElement(
                  "span",
                  { className: "muted" },
                  `${sessions.length} total`
                )
              ),
              sessions.length === 0
                ? React.createElement(
                    "p",
                    { className: "muted" },
                    "No sessions yet. Create one above."
                  )
                : React.createElement(
                    "div",
                    { className: "session-list" },
                    sessions.map((session) =>
                      React.createElement(
                        "article",
                        { className: "session-row", key: session.id },
                        React.createElement("h3", { className: "session-title" }, session.clientName),
                        React.createElement(
                          "p",
                          { className: "session-meta" },
                          `${formatDisplayDate(session.date)} • ${session.startTime} - ${session.endTime}`
                        ),
                        React.createElement(
                          "div",
                          { className: "actions" },
                          React.createElement(
                            "a",
                            {
                              className: "action-btn",
                              href: buildGoogleCalendarUrl(session),
                              target: "_blank",
                              rel: "noreferrer",
                            },
                            "Add to Google Calendar"
                          ),
                          React.createElement(
                            "button",
                            {
                              className: "action-btn",
                              type: "button",
                              onClick: () => downloadIcs(session),
                            },
                            "Download Apple Calendar (.ICS)"
                          )
                        )
                      )
                    )
                  )
            )
          )
        );
      }

      createRoot(document.getElementById("root")).render(React.createElement(SessionCreator));
    </script>
  </body>
</html>
